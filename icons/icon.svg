<path fill="#1c1f45" stroke="#07071a" stroke-width="7" stroke-linejoin="round" d="
M0 0 L512 0 L512 330 L500 250 L490 300 L484 150 L470 96
L440 104 L420 62 L396 102 L370 54 L344 100 L314 48 L288 102 L258 52 L232 100 L204 50 L176 102 L146 56 L120 100 L92 60 L62 100
L44 140 L40 340 L26 250 L14 320 L0 270Z"/>
