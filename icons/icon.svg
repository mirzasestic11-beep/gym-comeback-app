<g clip-path="url(#ec)">
 <ellipse cx="186" cy="262" rx="40" ry="46" fill="#1b2350"/>
 <ellipse cx="186" cy="262" rx="20" ry="26" fill="#07071a"/>
 <ellipse cx="200" cy="246" rx="9" ry="10" fill="#fff"/>
