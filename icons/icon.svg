<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
<linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7cfa6"/><stop offset="1" stop-color="#eeb98c"/></linearGradient>
<linearGradient id="lens" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dffb6" stop-opacity=".62"/><stop offset=".6" stop-color="#1ed173" stop-opacity=".55"/><stop offset="1" stop-color="#0a8a4a" stop-opacity=".7"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#cfd6ee"/><stop offset="1" stop-color="#8f9ac2"/></linearGradient>
<clipPath id="lc"><path d="M58 118 L366 118 L398 150 L398 352 L366 384 L90 384 L58 352Z"/></clipPath>
</defs>
<!-- skin base -->
<rect width="512" height="512" fill="url(#skin)"/>
<!-- cel shadow on cheek/side -->
