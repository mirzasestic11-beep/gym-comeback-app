<!-- soft shadow under the cheekbone -->
<path fill="#e1a77d" d="M0 430 C90 410 190 416 262 446 C200 452 130 470 70 512 L0 512Z"/>
<!-- green light from the lens on the cheek -->
<defs><radialGradient id="cast" cx="50%" cy="0%" r="60%"><stop offset="0" stop-color="#3dff95" stop-opacity=".45"/><stop offset=".6" stop-color="#3dff95" stop-opacity=".12"/><stop offset="1" stop-color="#3dff95" stop-opacity="0"/></radialGradient></defs>
<rect x="30" y="380" width="420" height="132" fill="url(#cast)"/>
<!-- LENS: big chamfered glass over the eye -->
<path fill-rule="evenodd" d="M50 110 L370 110 L406 146 L406 356 L370 392 L86 392 L50 356Z M58 118 L58 352 L90 384 L366 384 L398 352 L398 150 L366 118Z" fill="url(#metal)" stroke="#07071a" stroke-width="6" stroke-linejoin="round"/>
<path d="M58 118 L366 118 L398 150 L398 352 L366 384 L90 384 L58 352Z" fill="url(#lens)"/>
<g clip-path="url(#lc)">
 <g stroke="#ecfff4" stroke-opacity=".14" stroke-width="2"><path d="M50 140 H410 M50 160 H410 M50 180 H410 M50 200 H410 M50 220 H410 M50 240 H410 M50 260 H410 M50 280 H410 M50 300 H410 M50 320 H410 M50 340 H410 M50 360 H410"/></g>
