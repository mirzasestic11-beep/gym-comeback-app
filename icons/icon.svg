<!-- heavy upper lash line -->
<path d="M70 274 C114 222 196 206 270 232 L306 246 L276 244 C210 222 130 232 82 284Z" fill="#07071a"/>
<path d="M110 300 C160 312 220 302 262 280" stroke="#07071a" stroke-width="4" fill="none" stroke-linecap="round"/>
